<!DOCTYPE html>
<html lang="it" data-theme="dark" class="dark">
<head>
  <meta name="build-sha" content="bb8379cb03c6">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFDD00">
  <title>Sportello Assistenza & Supporto</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/ui-feedback.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, var(--ds-bg));
      --card-bg: var(--tg-theme-secondary-bg-color, var(--ds-surface));
      --text: var(--tg-theme-text-color, var(--ds-text));
      --subtext: var(--tg-theme-hint-color, var(--ds-muted));
      --accent: var(--tg-theme-button-color, var(--ds-accent));
      --accent-text: var(--tg-theme-button-text-color, var(--ds-accent-contrast));
      --border: var(--ds-border);
      --radius: var(--ds-radius-lg);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--ds-font-sans);
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--ds-accent), var(--ds-orange));
      color: var(--ds-accent-contrast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(255, 221, 0, 0.25);
    }

    .title-box h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .title-box p {
      font-size: 13px;
      color: var(--subtext);
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
      margin-bottom: 8px;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      background: var(--ds-surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: rgba(255, 221, 0, 0.14);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 700;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--ds-surface-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .footer {
      margin-top: auto;
      padding-top: 16px;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(255, 221, 0, 0.25);
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info-badge {
      font-size: 12px;
      color: var(--subtext);
      text-align: center;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-main">
      <div class="icon-box" aria-hidden="true">🆘</div>
      <div class="title-box">
        <h1>Sportello Assistenza</h1>
        <p>Crea un ticket nel Backlog del Coach</p>
      </div>
    </div>
  </div>

  <div class="card">
    <fieldset style="border: none; margin: 0; padding: 0;">
      <legend style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--subtext); margin-bottom: 8px;">Tipologia Segnalazione</legend>
      <div class="categories" role="radiogroup" aria-label="Tipologia Segnalazione">
        <button type="button" class="cat-btn active" role="radio" aria-checked="true" onclick="selectCategory('🐛 Bug / Errore', this)">🐛 Bug / Errore</button>
        <button type="button" class="cat-btn" role="radio" aria-checked="false" onclick="selectCategory('💡 Nuova Richiesta', this)">💡 Nuova Idea</button>
        <button type="button" class="cat-btn" role="radio" aria-checked="false" onclick="selectCategory('⏱️ Garmin / Cardio', this)">⏱️ Garmin / Cardio</button>
        <button type="button" class="cat-btn" role="radio" aria-checked="false" onclick="selectCategory('💬 Altro', this)">💬 Altro</button>
      </div>
    </fieldset>

    <label for="desc">Descrizione del Problema</label>
    <textarea id="desc" placeholder="Spiega cosa è successo o cosa vorresti modificare..." aria-required="true" aria-label="Descrizione del problema o richiesta" oninput="checkValid()"></textarea>
  </div>

  <div class="footer">
    <button type="button" class="submit-btn" id="sendBtn" onclick="submitTicket()" disabled>
      🚀 Invia Segnalazione al Coach
    </button>
    <div class="info-badge" aria-live="polite" id="chat-live-region">
      🔒 Il ticket verrà registrato come Segnalazione n°X nel Backlog
    </div>
  </div>

  <script src="assets/ui-feedback.js"></script>
  <script>
    let selectedCat = "🐛 Bug / Errore";
    const tg = window.Telegram?.WebApp;

    document.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    });

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function selectCategory(cat, btn) {
      selectedCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-checked', 'true');
    }

    function checkValid() {
      const text = document.getElementById('desc').value.trim();
      const btn = document.getElementById('sendBtn');
      btn.disabled = text.length < 3;
    }

    function submitTicket() {
      const text = document.getElementById('desc').value.trim();
      if (!text) return;

      const payload = {
        category: selectedCat,
        description: text,
        timestamp: new Date().toISOString()
      };

      if (tg && typeof tg.sendData === 'function') {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        UIFeedback.toast({
          title: "Segnalazione pronta",
          message: `<pre style="font-size:12px; margin-top:4px;">${JSON.stringify(payload, null, 2)}</pre>`,
          type: 'info',
          duration: 6000
        });
      }
    }
  </script>
</body>
</html>
